name: Sandcastle three-ticket Batch dogfood gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact verifier candidate commit
        required: true
        type: string
      confirm_candidate_sha:
        description: Repeat the exact verifier candidate commit
        required: true
        type: string
      dogfood_repository:
        description: Real owner/repository containing the three Tickets
        required: true
        type: string
      base_sha:
        description: Exact target default-branch commit before Batch start
        required: true
        type: string
      confirm_base_sha:
        description: Repeat the exact target base commit
        required: true
        type: string
      parent_issue:
        description: New parent PRD issue number
        required: true
        type: string
      ticket_one:
        description: First dependency-ordered Ticket
        required: true
        type: string
      ticket_two:
        description: Second dependency-ordered Ticket
        required: true
        type: string
      ticket_three:
        description: Third dependency-ordered Ticket
        required: true
        type: string
      release_version:
        description: Exact published SemVer under test
        required: true
        type: string
      confirm_release_version:
        description: Repeat the exact published SemVer
        required: true
        type: string
      legacy_dogfood_run_id:
        description: Successful #38 legacy dogfood gate run
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    name: Authorize Batch inputs and legacy dogfood prerequisite
    runs-on: ubuntu-24.04
    environment: release-batch-dogfood
    permissions:
      actions: read
      contents: read
    outputs:
      actor-permission: ${{ steps.authorization.outputs.actor-permission }}
      gate-id: ${{ steps.authorization.outputs.gate-id }}
      legacy-report-sha: ${{ steps.authorization.outputs.legacy-report-sha }}
    steps:
      - name: Verify immutable inputs, maintainer, and #38 report
        id: authorization
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_BASE_SHA: ${{ inputs.confirm_base_sha }}
          CONFIRM_CANDIDATE_SHA: ${{ inputs.confirm_candidate_sha }}
          CONFIRM_RELEASE_VERSION: ${{ inputs.confirm_release_version }}
          DOGFOOD_REPOSITORY: ${{ inputs.dogfood_repository }}
          GH_TOKEN: ${{ github.token }}
          LEGACY_DOGFOOD_RUN_ID: ${{ inputs.legacy_dogfood_run_id }}
          PARENT_ISSUE: ${{ inputs.parent_issue }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TICKET_ONE: ${{ inputs.ticket_one }}
          TICKET_THREE: ${{ inputs.ticket_three }}
          TICKET_TWO: ${{ inputs.ticket_two }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ || "$CANDIDATE_SHA" != "$CONFIRM_CANDIDATE_SHA" ]]; then
            exit 2
          fi
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" != "$CONFIRM_BASE_SHA" ]]; then
            exit 2
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$RELEASE_VERSION" != "$CONFIRM_RELEASE_VERSION" ]]; then
            exit 2
          fi
          if [[ ! "$DOGFOOD_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            exit 2
          fi
          for issue in "$PARENT_ISSUE" "$TICKET_ONE" "$TICKET_TWO" "$TICKET_THREE"; do
            if [[ ! "$issue" =~ ^[1-9][0-9]*$ ]]; then
              exit 2
            fi
          done
          if [[ "$PARENT_ISSUE" == "$TICKET_ONE" || "$PARENT_ISSUE" == "$TICKET_TWO" || "$PARENT_ISSUE" == "$TICKET_THREE" || "$TICKET_ONE" == "$TICKET_TWO" || "$TICKET_ONE" == "$TICKET_THREE" || "$TICKET_TWO" == "$TICKET_THREE" ]]; then
            exit 2
          fi
          if [[ ! "$LEGACY_DOGFOOD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            exit 2
          fi
          candidate_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CANDIDATE_SHA}" --jq .sha)"
          if [[ "$candidate_object" != "$CANDIDATE_SHA" ]]; then
            exit 2
          fi
          actor_permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          if [[ "$actor_permission" != "admin" && "$actor_permission" != "maintain" ]]; then
            exit 2
          fi
          legacy_run="$(gh run view "$LEGACY_DOGFOOD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,event,name)"
          jq -e \
            '.conclusion == "success" and .event == "workflow_dispatch" and .name == "Sandcastle legacy lifecycle dogfood gate"' \
            <<<"$legacy_run" >/dev/null
          mkdir -p "$RUNNER_TEMP/legacy-prerequisite"
          gh run download "$LEGACY_DOGFOOD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'sandcastle-legacy-dogfood-*' \
            --dir "$RUNNER_TEMP/legacy-prerequisite"
          legacy_report="$(find "$RUNNER_TEMP/legacy-prerequisite" -type f -name '*.json' -print -quit)"
          if [[ -z "$legacy_report" ]]; then
            exit 3
          fi
          jq -e --arg version "$RELEASE_VERSION" \
            '.command == "verify-legacy-dogfood" and .ok == true and .result.ok == true and .result.releaseVersion == $version' \
            "$legacy_report" >/dev/null
          legacy_report_sha="$(sha256sum "$legacy_report" | cut -d' ' -f1)"
          {
            printf 'actor-permission=%s\n' "$actor_permission"
            printf 'gate-id=batch-%s-%s\n' "$GITHUB_RUN_ID" "${CANDIDATE_SHA:0:12}"
            printf 'legacy-report-sha=%s\n' "$legacy_report_sha"
          } >> "$GITHUB_OUTPUT"

  dispatch-target:
    name: Run the three-ticket Batch in the real project
    needs: authorize
    runs-on: ubuntu-24.04
    environment: release-batch-dogfood
    permissions:
      actions: write
    steps:
      - name: Verify target base and dispatch its dedicated workflow
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DOGFOOD_REPOSITORY: ${{ inputs.dogfood_repository }}
          GATE_ID: ${{ needs.authorize.outputs.gate-id }}
          GH_TOKEN: ${{ secrets.BATCH_DOGFOOD_DISPATCH_TOKEN }}
          LEGACY_DOGFOOD_REPORT_SHA: ${{ needs.authorize.outputs.legacy-report-sha }}
          LEGACY_DOGFOOD_RUN_ID: ${{ inputs.legacy_dogfood_run_id }}
          PARENT_ISSUE: ${{ inputs.parent_issue }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TICKET_ONE: ${{ inputs.ticket_one }}
          TICKET_THREE: ${{ inputs.ticket_three }}
          TICKET_TWO: ${{ inputs.ticket_two }}
        run: |
          set -euo pipefail
          target_object="$(gh api "repos/${DOGFOOD_REPOSITORY}/commits/${BASE_SHA}" --jq .sha)"
          if [[ "$target_object" != "$BASE_SHA" ]]; then
            exit 2
          fi
          target_ref="$(gh api "repos/${DOGFOOD_REPOSITORY}" --jq .default_branch)"
          if [[ -z "$target_ref" ]]; then
            exit 2
          fi
          gh workflow run sandcastle-batch-dogfood.yml \
            --repo "$DOGFOOD_REPOSITORY" \
            --ref "$target_ref" \
            -f "base_sha=$BASE_SHA" \
            -f "candidate_repository=$CANDIDATE_REPOSITORY" \
            -f "candidate_sha=$CANDIDATE_SHA" \
            -f "gate_id=$GATE_ID" \
            -f "legacy_dogfood_report_sha=$LEGACY_DOGFOOD_REPORT_SHA" \
            -f "legacy_dogfood_run_id=$LEGACY_DOGFOOD_RUN_ID" \
            -f "parent_issue=$PARENT_ISSUE" \
            -f "release_version=$RELEASE_VERSION" \
            -f "ticket_one=$TICKET_ONE" \
            -f "ticket_two=$TICKET_TWO" \
            -f "ticket_three=$TICKET_THREE"

          run_id=""
          for _attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$DOGFOOD_REPOSITORY" \
              --workflow sandcastle-batch-dogfood.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"Sandcastle Batch dogfood $GATE_ID\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            exit 3
          fi
          gh run watch "$run_id" --repo "$DOGFOOD_REPOSITORY" --exit-status
          mkdir -p "$RUNNER_TEMP/batch-evidence"
          gh run download "$run_id" \
            --repo "$DOGFOOD_REPOSITORY" \
            --name "sandcastle-batch-dogfood-$GATE_ID" \
            --dir "$RUNNER_TEMP/batch-evidence"
          evidence_path="$(find "$RUNNER_TEMP/batch-evidence" -type f -name batch-dogfood.json -print -quit)"
          if [[ -z "$evidence_path" ]]; then
            exit 3
          fi
          cp "$evidence_path" "$RUNNER_TEMP/batch-dogfood.json"

      - name: Preserve target evidence for validation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-dogfood-target
          path: ${{ runner.temp }}/batch-dogfood.json
          if-no-files-found: ignore
          retention-days: 30

  batch-dogfood-gate:
    name: Validate sanitized three-ticket Batch evidence
    if: ${{ always() }}
    needs:
      - authorize
      - dispatch-target
    runs-on: ubuntu-24.04
    environment: release-batch-dogfood
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact verifier candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm

      - name: Build the candidate verifier
        run: npm ci --ignore-scripts && npm run build

      - name: Download any target evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: batch-dogfood-target
          path: ${{ runner.temp }}/batch-evidence

      - name: Assemble untrusted evidence without retaining invalid payloads
        if: ${{ always() }}
        shell: bash
        env:
          ACTOR_PERMISSION: ${{ needs.authorize.outputs.actor-permission }}
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DOGFOOD_REPOSITORY: ${{ inputs.dogfood_repository }}
          GATE_ID: ${{ needs.authorize.outputs.gate-id }}
          LEGACY_DOGFOOD_REPORT_SHA: ${{ needs.authorize.outputs.legacy-report-sha }}
          LEGACY_DOGFOOD_RUN_ID: ${{ inputs.legacy_dogfood_run_id }}
          PARENT_ISSUE: ${{ inputs.parent_issue }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TICKET_ONE: ${{ inputs.ticket_one }}
          TICKET_THREE: ${{ inputs.ticket_three }}
          TICKET_TWO: ${{ inputs.ticket_two }}
        run: |
          set -euo pipefail
          evidence='null'
          evidence_path="$(find "$RUNNER_TEMP/batch-evidence" -type f -name batch-dogfood.json -print -quit 2>/dev/null || true)"
          if [[ -n "$evidence_path" ]]; then
            evidence="$(jq -c -e 'if type == "object" then . else error("invalid") end' "$evidence_path" 2>/dev/null || printf 'null')"
          fi
          jq -cn \
            --arg actorPermission "$ACTOR_PERMISSION" \
            --arg baseSha "$BASE_SHA" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg gateId "$GATE_ID" \
            --arg legacyReportSha "$LEGACY_DOGFOOD_REPORT_SHA" \
            --arg legacyRunId "$LEGACY_DOGFOOD_RUN_ID" \
            --arg parentIssue "$PARENT_ISSUE" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg repository "$DOGFOOD_REPOSITORY" \
            --arg ticketOne "$TICKET_ONE" \
            --arg ticketTwo "$TICKET_TWO" \
            --arg ticketThree "$TICKET_THREE" \
            --argjson evidence "$evidence" \
            '{
              actorPermission: $actorPermission,
              baseSha: $baseSha,
              candidateSha: $candidateSha,
              evidence: $evidence,
              gateId: $gateId,
              legacyDogfood: {
                reportSha256: $legacyReportSha,
                runId: $legacyRunId
              },
              parentIssue: ($parentIssue | tonumber),
              releaseVersion: $releaseVersion,
              repository: $repository,
              tickets: [
                ($ticketOne | tonumber),
                ($ticketTwo | tonumber),
                ($ticketThree | tonumber)
              ]
            }' > "$RUNNER_TEMP/batch-dogfood-input.json"

      - name: Verify Batch processing, recovery, Final Review, and audit
        id: verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node dist/cli.js verify-batch-dogfood \
            --input "$RUNNER_TEMP/batch-dogfood-input.json" \
            | tee "$RUNNER_TEMP/batch-dogfood-gate.json"

      - name: Upload reviewable success or sanitized failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandcastle-batch-dogfood-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/batch-dogfood-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the dogfood gate
        if: ${{ always() && steps.verify.outcome != 'success' }}
        run: exit 4
