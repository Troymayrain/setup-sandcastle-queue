name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and full tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  api-contracts:
    name: Local GitHub and Anthropic contracts
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Exercise local API contracts
        run: >-
          npm run test:contracts --
          --candidate-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/contracts.json"
      - name: Preserve contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credentialless-api-contracts
          path: ${{ runner.temp }}/contracts.json
          if-no-files-found: error
          retention-days: 30

  fixture-matrix:
    name: Fixture ${{ matrix.fixture }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - mixed-python-pip-node-npm
          - python-uv
          - node-npm
          - go-module
          - java-maven
          - custom
          - existing-install
          - adopt
          - upgrade
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Use the pinned Python runtime
        if: ${{ matrix.fixture == 'mixed-python-pip-node-npm' || matrix.fixture == 'python-uv' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.8
      - name: Use the pinned uv runtime
        if: ${{ matrix.fixture == 'python-uv' }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.9.5
      - name: Use the pinned Go runtime
        if: ${{ matrix.fixture == 'go-module' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.23.4
      - name: Use the pinned Java runtime
        if: ${{ matrix.fixture == 'java-maven' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21.0.6
      - name: Use the checksum-bound Maven runtime
        if: ${{ matrix.fixture == 'java-maven' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.9.9-bin.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
          printf '4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c  %s\n' "$archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the complete credentialless lifecycle and isolated container
        run: >-
          node scripts/run-credentialless-fixture.mjs
          --fixture "${{ matrix.fixture }}"
          --candidate-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/${{ matrix.fixture }}.json"
      - name: Preserve fixture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credentialless-fixture-${{ matrix.fixture }}
          path: ${{ runner.temp }}/${{ matrix.fixture }}.json
          if-no-files-found: error
          retention-days: 30

  credentialless-gate:
    name: Verify the complete credentialless matrix
    if: ${{ always() }}
    needs:
      - quality
      - api-contracts
      - fixture-matrix
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Download available credentialless evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: credentialless-*
          path: ${{ runner.temp }}/credentialless-evidence
          merge-multiple: true
      - name: Assemble candidate-bound evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          fixtures='[]'
          contracts='{}'
          while IFS= read -r evidence_file; do
            if fixture="$(jq -c -e 'select(.fixture and .schemaVersion == 1)' "$evidence_file" 2>/dev/null)"; then
              fixtures="$(jq -cn --argjson current "$fixtures" --argjson item "$fixture" '$current + [$item]')"
            elif contract="$(jq -c -e 'select(.contracts and .schemaVersion == 1) | .contracts' "$evidence_file" 2>/dev/null)"; then
              contracts="$contract"
            fi
          done < <(find "$RUNNER_TEMP/credentialless-evidence" -type f -name '*.json' -print 2>/dev/null || true)
          jq -cn \
            --arg candidateSha "$GITHUB_SHA" \
            --argjson contracts "$contracts" \
            --argjson evidence "$fixtures" \
            '{
              candidateSha: $candidateSha,
              contracts: $contracts,
              evidence: $evidence,
              schemaVersion: 1
            }' > "$RUNNER_TEMP/fixture-matrix-input.json"
      - name: Verify fixture and contract evidence
        id: verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node dist/cli.js verify-fixture-matrix \
            --input "$RUNNER_TEMP/fixture-matrix-input.json" \
            | tee "$RUNNER_TEMP/fixture-matrix-gate.json"
      - name: Upload the reviewable credentialless gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandcastle-credentialless-${{ github.sha }}
          path: ${{ runner.temp }}/fixture-matrix-gate.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce the credentialless gate
        if: ${{ always() && steps.verify.outcome != 'success' }}
        run: exit 4
