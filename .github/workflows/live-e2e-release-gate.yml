name: Sandcastle live E2E release gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to verify
        required: true
        type: string
      confirm_candidate_sha:
        description: Repeat the exact candidate commit to authorize live work
        required: true
        type: string
      python_repository:
        description: Dedicated owner/repository for the pure Python fixture
        required: true
        type: string
      java_repository:
        description: Dedicated owner/repository for the Java 21/Maven fixture
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    name: Authorize candidate and maintainer
    runs-on: ubuntu-24.04
    environment: release-live-e2e
    permissions:
      contents: read
    outputs:
      actor-permission: ${{ steps.authorization.outputs.actor-permission }}
      gate-id: ${{ steps.authorization.outputs.gate-id }}
    steps:
      - name: Verify immutable inputs and maintainer permission
        id: authorization
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_CANDIDATE_SHA: ${{ inputs.confirm_candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ || "$CANDIDATE_SHA" != "$CONFIRM_CANDIDATE_SHA" ]]; then
            exit 2
          fi
          git_object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CANDIDATE_SHA}" --jq .sha)"
          if [[ "$git_object_type" != "$CANDIDATE_SHA" ]]; then
            exit 2
          fi
          actor_permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          if [[ "$actor_permission" != "admin" && "$actor_permission" != "maintain" ]]; then
            exit 2
          fi
          printf 'actor-permission=%s\n' "$actor_permission" >> "$GITHUB_OUTPUT"
          printf 'gate-id=live-%s-%s\n' "$GITHUB_RUN_ID" "${CANDIDATE_SHA:0:12}" >> "$GITHUB_OUTPUT"

  dispatch-fixtures:
    name: Run ${{ matrix.fixture }} fixture
    needs: authorize
    runs-on: ubuntu-24.04
    environment: release-live-e2e
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: python
            repository: ${{ inputs.python_repository }}
          - fixture: java-maven
            repository: ${{ inputs.java_repository }}
    steps:
      - name: Dispatch the dedicated fixture workflow
        id: dispatch
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FIXTURE: ${{ matrix.fixture }}
          FIXTURE_REPOSITORY: ${{ matrix.repository }}
          GATE_ID: ${{ needs.authorize.outputs.gate-id }}
          GH_TOKEN: ${{ secrets.LIVE_E2E_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$FIXTURE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            exit 2
          fi
          target_ref="$(gh api "repos/${FIXTURE_REPOSITORY}" --jq .default_branch)"
          if [[ -z "$target_ref" ]]; then
            exit 2
          fi
          gh workflow run sandcastle-live-e2e.yml \
            --repo "$FIXTURE_REPOSITORY" \
            --ref "$target_ref" \
            -f "candidate_repository=$CANDIDATE_REPOSITORY" \
            -f "candidate_sha=$CANDIDATE_SHA" \
            -f "fixture=$FIXTURE" \
            -f "gate_id=$GATE_ID"

          run_id=""
          for _attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$FIXTURE_REPOSITORY" \
              --workflow sandcastle-live-e2e.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"Sandcastle live E2E $GATE_ID\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            exit 3
          fi
          gh run watch "$run_id" --repo "$FIXTURE_REPOSITORY" --exit-status
          mkdir -p "$RUNNER_TEMP/fixture-evidence"
          gh run download "$run_id" \
            --repo "$FIXTURE_REPOSITORY" \
            --name "sandcastle-live-e2e-$GATE_ID" \
            --dir "$RUNNER_TEMP/fixture-evidence"
          evidence_path="$(find "$RUNNER_TEMP/fixture-evidence" -type f -name live-e2e.json -print -quit)"
          if [[ -z "$evidence_path" ]]; then
            exit 3
          fi
          cp "$evidence_path" "$RUNNER_TEMP/${FIXTURE}.json"

      - name: Preserve fixture evidence for the gate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-e2e-${{ matrix.fixture }}
          path: ${{ runner.temp }}/${{ matrix.fixture }}.json
          if-no-files-found: ignore
          retention-days: 30

  live-e2e-gate:
    name: Validate sanitized release evidence
    if: ${{ always() }}
    needs:
      - authorize
      - dispatch-fixtures
    runs-on: ubuntu-24.04
    environment: release-live-e2e
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm

      - name: Build the candidate verifier
        run: npm ci --ignore-scripts && npm run build

      - name: Download any fixture evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: live-e2e-*
          path: ${{ runner.temp }}/fixture-evidence
          merge-multiple: true

      - name: Assemble untrusted evidence without retaining invalid payloads
        if: ${{ always() }}
        shell: bash
        env:
          ACTOR_PERMISSION: ${{ needs.authorize.outputs.actor-permission }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATE_ID: ${{ needs.authorize.outputs.gate-id }}
          JAVA_REPOSITORY: ${{ inputs.java_repository }}
          PYTHON_REPOSITORY: ${{ inputs.python_repository }}
        run: |
          set -euo pipefail
          evidence='[]'
          while IFS= read -r evidence_file; do
            if parsed="$(jq -c -e 'if type == "object" then . else error("invalid") end' "$evidence_file" 2>/dev/null)"; then
              evidence="$(jq -cn --argjson current "$evidence" --argjson item "$parsed" '$current + [$item]')"
            fi
          done < <(find "$RUNNER_TEMP/fixture-evidence" -type f -name '*.json' -print 2>/dev/null || true)
          jq -cn \
            --arg actorPermission "$ACTOR_PERMISSION" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg gateId "$GATE_ID" \
            --arg pythonRepository "$PYTHON_REPOSITORY" \
            --arg javaRepository "$JAVA_REPOSITORY" \
            --argjson evidence "$evidence" \
            '{
              actorPermission: $actorPermission,
              candidateSha: $candidateSha,
              evidence: $evidence,
              gateId: $gateId,
              targets: [
                {fixture: "python", repository: $pythonRepository},
                {fixture: "java-maven", repository: $javaRepository}
              ]
            }' > "$RUNNER_TEMP/live-e2e-input.json"

      - name: Verify the candidate-bound live E2E contract
        id: verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node dist/cli.js verify-live-e2e \
            --input "$RUNNER_TEMP/live-e2e-input.json" \
            | tee "$RUNNER_TEMP/live-e2e-gate.json"

      - name: Upload reviewable success or sanitized failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandcastle-live-e2e-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/live-e2e-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the release gate
        if: ${{ always() && steps.verify.outcome != 'success' }}
        run: exit 4
